name: Django Test

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.13"
          - "3.14"
          - "3.15"
    env:
      DATABASE_URL: "sqlite:///:memory"
      DJANGO_SETTINGS_MODULE: teamtemp.settings.dev
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Setup
        run: |
          uv run --locked --python ${{ matrix.python-version }} python manage.py migrate --no-input
          uv run --locked --python ${{ matrix.python-version }} python manage.py collectstatic --no-input

      - name: Run tests
        run: |
          uv run --locked --python ${{ matrix.python-version }} coverage run manage.py test
          uv run --locked --python ${{ matrix.python-version }} coverage xml
          uv run --locked --python ${{ matrix.python-version }} coverage lcov
      #- name: Upload coverage to coveralls.io
      #  uses: coverallsapp/github-action@v2
      #  with:
      #    github-token: ${{ github.token }}
      #    path-to-lcov: coverage.lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          #token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          verbose: true
