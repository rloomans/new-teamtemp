[project]
name = "new-teamtemp"
version = "0.1.0"
description = "Survey and summarise team happiness"
requires-python = ">=3.12,<4.0"
authors = [{name = "Robert Loomans", email = "rloomans@users.noreply.github.com"}]
dependencies = [
    "Django[bcrypt]>=6.1.1,<7",
    "django-bootstrap3>=26.2,<27",
    "dj-database-url>=3.1.2,<4",
    "dj-static>=0.0.6,<0.0.7",
    "django-admin-csvexport>=2.4.1,<3",
    "django-csp>=4,<5",
    "crispy-bootstrap3>=2024.1,<2025",
    "django-crispy-forms>=2.7,<3",
    "django-filter>=26.1,<27",
    "djangorestframework>=3.17.1,<4",
    "drf-spectacular>=0.30.0,<0.31",
    "drf-spectacular-sidecar>=2026.10.1,<2027",
    "gunicorn>=25.3,<27",
    "gviz-api>=1.10.0,<2",
    "psycopg2-binary>=2.9.13,<3",
    "static>=1.1.1,<2",
    "whitenoise[brotli]>=6.12.0,<7",
    "pygments>=2.20.0,<3",
    "wordcloud>=1.9.6,<2",
    "markdown>=3.11,<4",
    "PyYAML>=6.0.3,<7",
    "uritemplate>=4.2.0,<5",
    "setuptools>=84.0.0,<85",
    "numpy>=2,<3",
    "requests>=2.33.1,<3",
    "pillow>=12.1.1,<13",
    "fonttools>=4.61.0,<5",
    "sqlparse>=0.6.0,<0.7",
    "zipp>=4.1.1,<5",
    "tzdata>=2026.4,<2027",
    "urllib3>=2.6.3,<3",
    "werkzeug>=3.1.8,<4",
]

[dependency-groups]
dev = [
    "coverage>=7.3.1",
    "db-sqlite3>=0.0.1",
    "django-extensions>=3.2.3",
    "factory-boy>=3.3.0",
    "factory-djoy>=2.2.2",
    "pydot>=1.4.2",
]

[tool.uv]
package = false
managed = true

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
# 'extend-exclude' excludes files or directories in addition to the defaults
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(
  ^/teamtemp/responses/migrations/*.py # exclude migration files
)
'''
skip-string-normalization = true
